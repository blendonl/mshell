name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Fetch vendored Lua
        run: |
          mkdir -p vendor/lua && cd vendor/lua
          curl -sSLO https://www.lua.org/ftp/lua-5.4.7.tar.gz
          tar xzf lua-5.4.7.tar.gz --strip-components=1

      - name: Host-side unit tests
        run: make test

      - name: Editor types are up to date
        run: |
          make meta
          git diff --exit-code meta/

      - name: Build (warnings are errors)
        run: make CFLAGS_EXTRA=-Werror

      - name: Check the release assembles
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: mshell-win64
          path: dist/*.zip
